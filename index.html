<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>slopkit - Установка кэша</title>
    <style>
        body { 
            background: #0c111b; 
            color: #d8dee9; 
            font-family: "Consolas", monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #status { font-size: 26px; font-weight: bold; margin-bottom: 20px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #3b4756; border-top: 4px solid #5e81ac;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner" id="loader"></div>
    <div id="status" style="margin-top:20px;">Кэширование среды...</div>

    <script>
        // Ваш целевой URL с параметрами
        const targetUrl = "./poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=17";

        function redirect() {
            document.getElementById('status').innerText = "Готово! Запуск...";
            document.getElementById('loader').style.display = "none";
            setTimeout(() => { window.location.href = targetUrl; }, 600);
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(function(reg) {
                // Ждем, пока Service Worker скачает файлы
                if (reg.installing) {
                    reg.installing.addEventListener('statechange', function(e) {
                        if (e.target.state === 'installed') redirect();
                    });
                } else if (reg.active) {
                    // Если кэш уже был установлен ранее
                    redirect();
                }
            }).catch(function(err) {
                document.getElementById('status').innerText = "Ошибка кэширования, запуск по сети...";
                setTimeout(() => { window.location.href = targetUrl; }, 1500);
            });
        } else {
            redirect();
        }
    </script>
</body>
</html>
