<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>slopkit - Запуск</title>
    <style>
        body { 
            background: #0c111b; 
            color: #d8dee9; 
            font-family: "Consolas", monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        #status { font-size: 26px; font-weight: bold; margin-bottom: 20px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #3b4756; border-top: 4px solid #5e81ac;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner" id="loader"></div>
    <div id="status" style="margin-top:20px;">Кэширование среды...</div>

    <script>
        const targetUrl = "./slopkit/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=17";

        // Если Service Worker уже установлен и контролирует страницу (кэш есть) - МОМЕНТАЛЬНЫЙ РЕДИРЕКТ
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            window.location.replace(targetUrl);
        } 
        else if ('serviceWorker' in navigator) {
            // Если кэша еще нет, регистрируем и показываем анимацию загрузки
            navigator.serviceWorker.register('./sw.js').then(function(reg) {
                if (reg.installing) {
                    reg.installing.addEventListener('statechange', function(e) {
                        // Как только скачивание завершилось - моментальный редирект
                        if (e.target.state === 'installed') {
                            window.location.replace(targetUrl);
                        }
                    });
                } else if (reg.active) {
                    // Резервная проверка
                    window.location.replace(targetUrl);
                }
            }).catch(function() {
                // Если произошла ошибка (например, нет сети при первой попытке)
                window.location.replace(targetUrl);
            });
        } 
        else {
            // Для браузеров без поддержки Service Worker
            window.location.replace(targetUrl);
        }
    </script>
</body>
</html>
