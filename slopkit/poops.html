    <!-- ОРИГИНАЛЬНЫЙ ПЕРЕХВАТЧИК ОШИБОК -->
    <script>
    (function () {
        var pending = [];
        window.__jbEarly = pending;
        function raw(tag, text) {
            var line = "a0-rboot-s" + (pending.length + 1) + "-note-" + tag
                + "-" + String(text).replace(/[^A-Za-z0-9_.:=,+-]/g, "_").slice(0, 160);
            pending.push(line);
            try {
                var d = document.getElementById("early");
                if (d) d.textContent += line + "\n";
            } catch (e) { }
            // Трансляция в наш UI
            if(window.uiScreenLine) window.uiScreenLine(`[RAW] ${tag}: ${text}`);
        }
        window.__jbRaw = raw;
        window.alert = function (m) { raw("ALERT-INTERCEPTED", m); };
        window.confirm = function (m) { raw("CONFIRM-INTERCEPTED", m); return false; };
        window.addEventListener("error", function (e) {
            raw("WINDOW-ERROR", (e && e.message) + "@" + (e && e.filename) + ":" + (e && e.lineno));
        });
        window.addEventListener("unhandledrejection", function (e) {
            raw("UNHANDLED-REJECTION", e && e.reason && (e.reason.message || e.reason));
        });
    })();
    </script>

    <!-- ================= ЛОГИКА UI И СВЯЗЬ С ЯДРОМ ================= -->
    <script>
        const CONFIG = {
            payloads: [
                { id: 'PM',   title: 'PLDMGR',   file: 'pldmgr-ps5.elf' },
                { id: 'FTP',  title: 'FTP_SRV',  file: 'ftpsrv-ps5.elf' },
                { id: 'KLOG', title: 'KLOG_SRV', file: 'klogsrv-ps5.elf' },
                { id: 'GDB',  title: 'GDB_SRV',  file: 'gdbsrv-ps5.elf' }
            ],
            autoLoadEnabled: false, 
            autoLoadFile: 'pldmgr-ps5.elf', 
            autoLoadDelay: 2000
        };

        let currentPhase = -1;
        const uiLines = [];
        const scrUiEl = document.getElementById("scr-ui");
        const globalStageEl = document.getElementById("global-stage");
        const payloadMenuUiEl = document.getElementById("payloadMenuUI");

        function setNodeState(nodeId, statusText, state) {
            const node = document.getElementById(nodeId);
            if (!node) return;
            node.querySelector('.status-text').innerText = statusText;
            node.className = `node-row border-2 rounded-lg p-3 flex items-center justify-between gap-4 node-${state}`;
        }

        // --- ЭКСПОРТ ДЛЯ ОРИГИНАЛЬНОГО СКРИПТА ---
        window.uiScreenLine = function(text) {
            const time = new Date().toLocaleTimeString('ru-RU');
            let formatted = text.replace(/<[^>]*>?/gm, ''); 
            if (formatted.includes("PASS") || formatted.includes("SUCCESS")) formatted = `<span class="text-slop-success">${formatted}</span>`;
            else if (formatted.includes("FAIL") || formatted.includes("ERROR") || formatted.includes("reboot")) formatted = `<span class="text-slop-red">${formatted}</span>`;
            else if (formatted.includes(">")) formatted = `<span class="text-slop-neon">${formatted}</span>`;
            
            uiLines.push(`<span class="text-slop-text/50">[${time}]</span> ${formatted}`);
            if (uiLines.length > 20) uiLines.shift();
            try { scrUiEl.innerHTML = uiLines.join("\n") + '\n<span class="cursor-blink text-slop-neon">_</span>'; scrUiEl.scrollTop = scrUiEl.scrollHeight; } catch(e) {}
        };

        window.uiUpdateStage = function(text, cls) {
            const low = String(text).toLowerCase();
            let ruText = text;
            let isError = (cls === 'bad' || low.includes('fail') || low.includes('reboot') || low.includes('error'));

            if (isError) ruText = "КРИТИЧЕСКАЯ ОШИБКА";
            else if (low.includes('idle')) ruText = "ОЖИДАНИЕ СИСТЕМЫ";
            else if (low.includes('webkit') || low.includes('primitive')) ruText = "ЗАПУСК WEBKIT EXPLOIT";
            else if (low.includes('poops_lib') || low.includes('prepare')) ruText = "ПОДГОТОВКА ЯДРА";
            else if (low.includes('ladder')) ruText = "ЭСКАЛАЦИЯ ПРИВИЛЕГИЙ";
            else if (low.includes('elf loader ready') || low.includes('success')) ruText = "ELF ЗАГРУЗЧИК ГОТОВ";

            let borderCls = "border-slop-border text-slop-text";
            let shadowCls = "";
            if (cls === "ok" || ruText === "ELF ЗАГРУЗЧИК ГОТОВ") { borderCls = "border-slop-success text-slop-success"; shadowCls = "shadow-[0_0_15px_rgba(0,255,85,0.2)]"; }
            else if (isError) { borderCls = "border-slop-red text-slop-red"; shadowCls = "shadow-[0_0_15px_rgba(255,0,60,0.3)]"; }
            else if (currentPhase >= 0) { borderCls = "border-slop-neon text-slop-neon"; shadowCls = "shadow-[0_0_15px_rgba(0,210,255,0.2)]"; }

            globalStageEl.className = `text-sm sm:text-lg font-display font-bold px-4 py-2 rounded-lg bg-slop-panel w-full md:w-auto text-center md:text-right transition-all border-2 ${borderCls} ${shadowCls} uppercase`;
            globalStageEl.innerText = ruText;

            if (isError) {
                if(currentPhase === 0) setNodeState('node-wk', 'Сбой эксплоита', 'error');
                else if(currentPhase === 1) setNodeState('node-kr', 'Сбой ядра', 'error');
                else if(currentPhase === 2) setNodeState('node-jb', 'Сбой обхода', 'error');
                else if(currentPhase === 3) setNodeState('node-elf', 'Ошибка загрузчика', 'error');
                else setNodeState('node-wk', 'Сбой запуска', 'error');
                return;
            }

            if (low.includes('webkit') || low.includes('primitive')) { currentPhase = 0; setNodeState('node-wk', 'Выполнение...', 'active'); }
            else if (low.includes('poops_lib') || low.includes('prepare')) { currentPhase = 1; setNodeState('node-wk', 'Успешно', 'success'); setNodeState('node-kr', 'Инициализация...', 'active'); }
            else if (low.includes('ladder')) { currentPhase = 2; setNodeState('node-kr', 'Успешно', 'success'); setNodeState('node-jb', 'Взлом ядра...', 'active'); }
            else if (low.includes('elf loader ready') || low.includes('success')) {
                currentPhase = 3;
                setNodeState('node-wk', 'Успешно', 'success'); setNodeState('node-kr', 'Успешно', 'success'); setNodeState('node-jb', 'Успешно', 'success'); setNodeState('node-elf', 'Запущен', 'success');
            }
        };

        window.uiShowPayloadMenu = function() {
            payloadMenuUiEl.classList.remove('hidden-sys'); payloadMenuUiEl.classList.add('flex');
            if (CONFIG.autoLoadEnabled && CONFIG.autoLoadFile) {
                const statusEl = document.getElementById('payload-status');
                const target = CONFIG.payloads.find(p => p.file === CONFIG.autoLoadFile) || { title: CONFIG.autoLoadFile };
                statusEl.innerText = `Автозапуск ${target.title} через ${(CONFIG.autoLoadDelay/1000).toFixed(1)} сек...`;
                statusEl.className = "text-xs text-slop-warning";
                
                document.querySelectorAll('.payload-btn').forEach(btn => {
                    if(btn.getAttribute('data-name') !== CONFIG.autoLoadFile) btn.classList.add('opacity-30', 'pointer-events-none');
                });
                setTimeout(() => {
                    const btn = document.querySelector(`.payload-btn[data-name="${CONFIG.autoLoadFile}"]`);
                    if (btn) handlePayloadClick(btn);
                }, CONFIG.autoLoadDelay);
            }
        };

        function renderPayloads() {
            const grid = document.getElementById('payload-grid');
            grid.innerHTML = '';
            CONFIG.payloads.forEach(p => {
                const btn = document.createElement('button');
                btn.className = "payload-btn p-3 border border-slop-border rounded hover:border-slop-neon hover:text-white transition-colors flex flex-col items-center justify-center gap-2 bg-slop-panel text-slop-text";
                btn.setAttribute('data-name', p.file);
                btn.onclick = function() { handlePayloadClick(this); };
                btn.innerHTML = `<span class="font-display font-bold text-lg">${p.id}</span><span class="text-[10px] font-bold">${p.title}</span>`;
                grid.appendChild(btn);
            });
        }

        async function handlePayloadClick(btn) {
            const name = btn.getAttribute('data-name');
            const statusEl = document.getElementById('payload-status');
            if (btn.disabled) return;
            
            document.querySelectorAll('.payload-btn').forEach(b => b.disabled = true);
            btn.classList.add('border-slop-warning', 'text-white');
            statusEl.innerText = `Отправка ${name}...`; statusEl.className = "text-xs text-slop-warning font-bold";
            window.uiScreenLine(`> ЗАПРОС PAYLOAD: ${name}`);
            
            try {
                if(window.isSimulation) await new Promise(r => setTimeout(r, 1500));
                else if(typeof window.coreSendPayload === 'function') await window.coreSendPayload(name);
                else throw new Error("Ядро эксплоита недоступно");
                
                statusEl.innerText = `${name} УСПЕШНО ЗАГРУЖЕН`; statusEl.className = "text-xs text-slop-success font-bold";
                window.uiScreenLine(`УСПЕХ: ${name} отправлен`);
                btn.classList.replace('border-slop-warning', 'border-slop-success'); btn.classList.add('bg-slop-success/20');
            } catch (err) {
                statusEl.innerText = `ОШИБКА: ${err.message || err}`; statusEl.className = "text-xs text-slop-red font-bold";
                window.uiScreenLine(`ОШИБКА ОТПРАВКИ: ${name}`);
                btn.classList.replace('border-slop-warning', 'border-slop-red');
            } finally {
                document.querySelectorAll('.payload-btn').forEach(b => b.disabled = false);
            }
        }

        async function runSimulation() {
            window.isSimulation = true; document.getElementById('sim-btn').classList.add('hidden-sys');
            const delay = (ms) => new Promise(r => setTimeout(r, ms));
            window.uiScreenLine("Инициализация Slopkit UI..."); await delay(800);
            window.uiUpdateStage("waiting for the primitive", ""); await delay(1500); window.uiScreenLine("> alloc_history_spray [PASS]");
            window.uiUpdateStage("prepare(): module bases", ""); await delay(1500);
            window.uiUpdateStage("running the ladder", ""); await delay(1500);
            window.uiUpdateStage("ELF LOADER READY", "ok"); window.uiShowPayloadMenu();
        }

        window.onload = function() {
            renderPayloads();
            window.uiScreenLine("СИСТЕМА ГОТОВА К ЗАПУСКУ.");
            if(new URLSearchParams(window.location.search).get('go') === '1') {
                document.getElementById('sim-btn').classList.add('hidden-sys');
            }
        };
    </script>

    <!-- ================= ПОДКЛЮЧЕНИЕ ОРИГИНАЛЬНЫХ СКРИПТОВ ЯДРА ================= -->
    <script src="rop.js"></script>
    <script src="main.js?v=16"></script>
    <script>
        window.offsetsReady = new Promise(function (res, rej) {
            var s = document.querySelector('script[src^="../offsets/"]');
            if (!s) return rej(new Error("offsets script was never injected by main.js"));
            if (typeof OFFSET_wk_vtable_first_element !== "undefined") return res(s.src);
            s.addEventListener("load", function () { res(s.src); });
            s.addEventListener("error", function () { rej(new Error("offsets 404: " + s.src)); });
        });
    </script>

    <!-- ================= ОРИГИНАЛЬНЫЙ МОДУЛЬ (С ВНЕДРЕННЫМИ UI ХУКАМИ) ================= -->
    <script type="module">
        import { establishPrimitive, fakeCellReleased } from "./core.js?v=10";
        import { installWindowP, pairStatus } from "./mem.js?v=10";
        import { int64 } from "./int64.js";
        import { BANNED, ERRNO, K, r32, r16, w32, hexBytes, coreList } from "./poops.js?v=16";

        let PK = null, makePoopsEngine = null, buildLadder = null;

        async function loadPoopsModules() {
            const lib = await import("./poops.js?v=16");
            const st = await import("./poops.js?v=16");
            PK = lib.PK;
            makePoopsEngine = lib.makePoopsEngine;
            buildLadder = st.buildLadder;
            flushMark("POOPS-MODULES-LOADED", "deferred-until-after-primitive");
        }

        const Q = new URLSearchParams(location.search);
        const ARMED = Q.get("go") === "1";
        const CLEARLATCH = Q.get("clear") === "1";
        const AUTOCLEAR = Q.get("auto") === "1";
        const FROM = Q.get("from") || "";
        const ONLY = (Q.get("only") || "").split(",").map(s => s.trim()).filter(Boolean);
        const FILTERED_RUN = ONLY.length > 0 || FROM !== "";
        const MAX_ATTEMPTS = parseInt(Q.get("max") || "0", 10) || 0;
        const CORE_OVERRIDE = Q.has("core") ? parseInt(Q.get("core"), 10) : -1;
        const PROGRESS_KEY = "slopkit-poops:next";
        const RUNLOG_KEY = "slopkit-poops:last";
        const REV = "slopkit-poops-28-clean-success-menu";

        function storeGet(k) { try { return sessionStorage.getItem(k) || ""; } catch { return ""; } }
        function storeSet(k, v) { try { sessionStorage.setItem(k, v); } catch { } }
        function storeDel(k) { try { sessionStorage.removeItem(k); } catch { } }
        function storeJson(k) { const raw = storeGet(k); if (!raw) return null; try { return JSON.parse(raw); } catch { return null; } }
        
        const STALLED_AT = storeGet(PROGRESS_KEY);
        const LAST_RUN = storeJson(RUNLOG_KEY);

        const TRIGGER = (() => { const t = (Q.get("trigger") || "none").toLowerCase(); return (t === "netcontrol" || t === "overflow") ? t : "none"; })();
